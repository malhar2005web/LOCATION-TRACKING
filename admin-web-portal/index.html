<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCS Admin Portal</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">

    <div class="login-wrapper">
        <div class="login-container">
            
            <!-- Header & PCS Logo -->
            <div class="login-header">
                <div class="logo-box">
                    <img src="img/pcs-logo.png?v=2" alt="PCS Logo" class="brand-logo">
                </div>
                <h1 class="portal-title">Sky-Diary Admin</h1>
                <p class="portal-subtitle">Location Tracking & Daily Sales Reporting System</p>
            </div>

            <!-- Admin Login Form -->
            <form id="admin-form" class="form-card active" onsubmit="event.preventDefault(); handleAdminLogin();">
                <div class="input-group">
                    <label class="input-label" for="admin-id">Admin Username / ID</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </span>
                        <input type="text" id="admin-id" placeholder="Enter admin ID" class="form-input" required autocomplete="username" value="admin">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="admin-password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="admin-password" placeholder="Enter password" class="form-input" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('admin-password', this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-admin-submit" class="primary-btn">
                    <span class="btn-text">Login to Dashboard</span>
                    <span class="btn-arrow">→</span>
                </button>
            </form>

            <div class="login-footer">
                <p>&copy; 2026 Sky-Diary. All rights reserved.</p>
            </div>

        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
