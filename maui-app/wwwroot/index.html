    <script>
        // Global error logging
        (function() {
            window.onerror = function(msg, src, line, col, err) {
                console.error('[Global Error]', msg, src, line, col, err);
                return false;
            };

            window.addEventListener('unhandledrejection', function(event) {
                console.error('[Unhandled Promise Rejection]', event.reason);
            });
        })();
    </script>

    <script>
        // Theme pre-initialization (from Cordova index.html)
        (function() {
            try {
                var theme = localStorage.getItem('theme-preference');
                var hour = new Date().getHours();
                var isNight = (hour >= 18 || hour < 6);
                if (theme === 'dark' || (!theme && isNight)) {
                    document.documentElement.classList.add('dark-mode');
                } else {
                    document.documentElement.classList.remove('dark-mode');
                }
            } catch(e) {
                console.error(e);
            }
        })();
    </script>

<body>

    <!-- JS-to-C# Bridge for Storage and Native Setting Redirects -->
    <script>
        // Queue/Retry helper for C# invocations until DotNet and its call dispatcher are ready
        function invokeCSharp(methodName, ...args) {
            if (typeof DotNet !== 'undefined') {
                try {
                    return DotNet.invokeMethodAsync('LOCATION_TRACKING', methodName, ...args)
                        .catch(err => {
                            if (err && err.message && err.message.indexOf('dispatcher') !== -1) {
                                return retryInvokeCSharp(methodName, args);
                            }
                            console.error(`[Bridge] Error calling C# method ${methodName}:`, err);
                        });
                } catch (e) {
                    return retryInvokeCSharp(methodName, args);
                }
            } else {
                return retryInvokeCSharp(methodName, args);
            }
        }

        function retryInvokeCSharp(methodName, args) {
            console.warn(`[Bridge] DotNet or dispatcher not ready. Queuing call: ${methodName}`);
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (typeof DotNet !== 'undefined') {
                        try {
                            DotNet.invokeMethodAsync('LOCATION_TRACKING', methodName, ...args)
                                .then((val) => {
                                    clearInterval(checkInterval);
                                    resolve(val);
                                })
                                .catch(err => {
                                    if (err && err.message && err.message.indexOf('dispatcher') !== -1) {
                                        return; // retry next tick
                                    }
                                    clearInterval(checkInterval);
                                    console.error(`[Bridge] Error calling C# method ${methodName} after init:`, err);
                                    resolve(null);
                                });
                        } catch (e) {
                            // dispatcher sync error, retry next tick
                        }
                    }
                }, 100);
                // timeout after 10 seconds
                setTimeout(() => {
                    clearInterval(checkInterval);
                    console.warn(`[Bridge] DotNet initialization timed out for method: ${methodName}`);
                    resolve(null);
                }, 10000);
            });
        }

        // Intercept localStorage setItem/removeItem to synchronize with C# Preferences
        const originalSetItem = localStorage.setItem;
        localStorage.setItem = function(key, value) {
            originalSetItem.apply(this, arguments);
            if (key === 'isDayStarted' || key === 'isCheckedIn' || key === 'client_id' || key === 'auth_token' || key === 'client_name' || key === 'employee_id') {
                try {
                    invokeCSharp('OnLocalStorageChanged', key, value);
                } catch (e) {
                    console.error('Failed to notify C#:', e);
                }
            }
        };

        const originalRemoveItem = localStorage.removeItem;
        localStorage.removeItem = function(key) {
            originalRemoveItem.apply(this, arguments);
            if (key === 'isDayStarted' || key === 'isCheckedIn' || key === 'client_id' || key === 'auth_token' || key === 'client_name' || key === 'employee_id') {
                try {
                    invokeCSharp('OnLocalStorageChanged', key, null);
                } catch (e) {
                    console.error('Failed to notify C#:', e);
                }
            }
        };

        // Mock AlarmBridge native plugin, routing calls to JSInvokable C# methods
        window.AlarmBridge = {
            requestLocationPermission: function() {
                invokeCSharp('RequestLocationPermission');
            },
            requestNotificationPermission: function() {
                invokeCSharp('RequestNotificationPermission');
            },
            requestFullScreenIntentPermission: function() {
                invokeCSharp('RequestFullScreenIntentPermission');
            },
            requestOverlayPermission: function() {
                invokeCSharp('RequestOverlayPermission');
            },
            requestBatteryOptimizationExemption: function() {
                invokeCSharp('RequestBatteryOptimizationExemption');
            },
            getDeviceId: function(successCallback, errorCallback) {
                invokeCSharp('GetDeviceId')
                    .then(id => {
                        if (successCallback) successCallback(id);
                    })
                    .catch(err => {
                        if (errorCallback) errorCallback(err);
                    });
            },
            getAutomaticTimeSettings: function(successCallback, errorCallback) {
                invokeCSharp('GetAutomaticTimeSettings')
                    .then(jsonStr => {
                        if (successCallback) {
                            try {
                                successCallback(JSON.parse(jsonStr));
                            } catch (e) {
                                successCallback({ autoTime: true, autoTimeZone: true });
                            }
                        }
                    })
                    .catch(err => {
                        if (errorCallback) errorCallback(err);
                    });
            }
        };

        window.callNativePermission = function(action) {
            if (window.AlarmBridge[action]) {
                window.AlarmBridge[action]();
            } else {
                console.warn('Unknown AlarmBridge action:', action);
            }
        };
    </script>
